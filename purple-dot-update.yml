name: Purple Dot Waitlist Update
on:
  workflow_dispatch:
    inputs:
      payload:
        description: "JSON payload generated by the website"
        required: true
        type: string
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: "22"}
      - name: Update Purple Dot waitlists
        env:
          PURPLE_DOT_ACCESS_TOKEN: ${{ secrets.PURPLE_DOT_ACCESS_TOKEN }}
          PAYLOAD: ${{ inputs.payload }}
        run: node scripts/update-waitlists.mjs
