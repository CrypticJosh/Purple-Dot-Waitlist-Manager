name: Purple Dot Update

on:
  workflow_dispatch:
    inputs:

      payload:
        description: "Waitlist update payload"
        required: true
        type: string

jobs:

  update:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run update
        env:
          PURPLE_DOT_ACCESS_TOKEN: ${{ secrets.PURPLE_DOT_ACCESS_TOKEN }}
          PAYLOAD: ${{ inputs.payload }}
        run: |
          node scripts/update-waitlists.mjs
