name: Purple Dot Waitlist Lookup
on:
  workflow_dispatch:
    inputs:
      skus:
        description: "SKUs to find"
        required: true
        type: string
permissions:
  contents: read
jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: "22"}
      - name: Lookup
        env:
          PURPLE_DOT_ACCESS_TOKEN: ${{ secrets.PURPLE_DOT_ACCESS_TOKEN }}
          SKUS: ${{ inputs.skus }}
        run: node scripts/lookup-waitlists.mjs
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: purple-dot-lookup-result
          path: lookup-result.json
