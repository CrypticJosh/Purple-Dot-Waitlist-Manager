name: Purple Dot Waitlist Lookup

on:
  workflow_dispatch:
    inputs:
      skus:
        description: "SKUs to find"
        required: true
        type: string

permissions:
  contents: read

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Lookup Purple Dot waitlists
        env:
          PURPLE_DOT_ACCESS_TOKEN: ${{ secrets.PURPLE_DOT_ACCESS_TOKEN }}
          SKUS: ${{ inputs.skus }}
        run: node scripts/lookup-waitlists.mjs

      - name: Upload lookup result
        uses: actions/upload-artifact@v4
        with:
          name: purple-dot-lookup-result
          path: lookup-result.json
