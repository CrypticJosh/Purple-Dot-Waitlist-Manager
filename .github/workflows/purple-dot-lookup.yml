name: Purple Dot Lookup

on:
  workflow_dispatch:
    inputs:
      skus:
        description: "SKUs to find"
        required: true
        type: string

jobs:

  lookup:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Purple Dot lookup
        env:
          PURPLE_DOT_ACCESS_TOKEN: ${{ secrets.PURPLE_DOT_ACCESS_TOKEN }}
          SKUS: ${{ inputs.skus }}
        run: |
          node scripts/lookup-waitlists.mjs

      - name: Upload lookup result
        uses: actions/upload-artifact@v4
        with:
          name: purple-dot-lookup-result
          path: lookup-result.json
          retention-days: 1
